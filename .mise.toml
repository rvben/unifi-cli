# Reproducible local and CI tooling.
min_version = "2026.4.19"

[env]
RUST_BACKTRACE = "1"
BINSTALL_DISABLE_TELEMETRY = "true"

[tools]
rust = "1.96.0"
actionlint = "1.7.12"
cargo-binstall = "1.22.0"
"cargo:cargo-nextest" = "0.9.143"

[settings]
cargo.binstall = true

[tasks.setup]
description = "Install the exact development toolchain"
run = """
mise install rust actionlint cargo-binstall
mise install cargo:cargo-nextest
"""
