name: upd dependency health

on:
  schedule:
    - cron: "51 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@ac374e74eb4f6b5cbd39965c65292ae5e2b51411 # v0.9.2
    with:
      min-age: 7d
      max-bump: minor
      fail-on-blocked: false
