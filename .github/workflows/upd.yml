name: upd dependency health

on:
  schedule:
    - cron: "51 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@1a8c9cd6e0e5f21251f89b2bd9f9fcbff776030d
    with:
      min-age: 7d
      max-bump: minor
      fail-on-blocked: false
