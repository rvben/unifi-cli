name: Dependency health

on:
  schedule:
    - cron: "51 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@a6335d64643d55ae6c04bcc961b964147075eb92 # v0.10.4
    with:
      langs: rust,actions
      lock: true
      min-age: 7d
      max-bump: minor
      validation-command: make check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): refresh dependencies"
