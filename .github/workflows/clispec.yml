name: CLI health

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '51 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: clispec v0.3
    uses: rvben/clispec/.github/workflows/conformance.yml@6fb51e2692272f4723fa8b572c3b175b8d41364f
    with:
      binary: target/debug/unifi

  published-artifacts:
    name: Published artifacts
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: rvben/clispec/.github/workflows/published-artifacts.yml@703da8137f537dbd03714761a2da8e1fb026c8c7
    with:
      crates: "unifi-cli"
      pypi: unifi-cli
      homebrew-formula: unifi-cli
