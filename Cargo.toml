[package]
name = "unifi-cli"
version = "0.0.2"
edition = "2024"
rust-version = "1.90"
description = "CLI for UniFi Network controller"
license = "MIT"
repository = "https://github.com/rvben/unifi-cli"
homepage = "https://github.com/rvben/unifi-cli"
keywords = ["unifi", "ubiquiti", "cli", "network"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tabled = "0.17"
toml = "0.8"
dirs = "6"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
