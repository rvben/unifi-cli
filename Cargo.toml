[package]
name = "unifi-cli"
version = "0.2.3"
edition = "2024"
rust-version = "1.90"
description = "CLI for UniFi Network controller"
license = "MIT"
repository = "https://github.com/rvben/unifi-cli"
homepage = "https://github.com/rvben/unifi-cli"
keywords = ["unifi", "ubiquiti", "cli", "network"]
categories = ["command-line-utilities"]

[[bin]]
name = "unifi"
path = "src/main.rs"

[[bin]]
name = "unifi-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
owo-colors = "4"
dirs = "6"
ratatui = "0.30"
crossterm = "0.29"
rpassword = "7.4.0"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
jsonschema = "0.28"
